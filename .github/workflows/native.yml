name: Native Windows build

on:
  push:
    paths-ignore:
      - 'validation/**'
      - 'PROGRESS.md'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - name: Fetch exact source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE) { throw 'git init failed' }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE) { throw 'git remote failed' }
          git -c protocol.version=2 fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }

      - name: Compile embedded shaders, game, and simulation tests
        shell: cmd
        run: build.bat ${{ matrix.configuration }}

      - name: Launch D3D12 WARP and validate captured frame
        shell: pwsh
        run: ./tools/smoke.ps1 -Executable ./build/${{ matrix.configuration }}/MeridianCoast.exe -RequireTiming

      - name: Validate incremental streaming and world epoch reset
        shell: pwsh
        run: ./tools/smoke.ps1 -Executable ./build/${{ matrix.configuration }}/MeridianCoast.exe -Frames 120 -Scene streaming -RequireTiming

      - name: Validate distant coverage and visible tile residency
        shell: pwsh
        run: ./tools/smoke.ps1 -Executable ./build/${{ matrix.configuration }}/MeridianCoast.exe -Frames 320 -Scene lod -TimeoutSeconds 300 -RequireTiming

      - name: Validate resize and fullscreen resource lifetime
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./tools/smoke.ps1 -Executable ./build/Debug/MeridianCoast.exe -Frames 120 -Scene lifecycle -RequireTiming

      - name: Validate single-sample HDR resize path
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./tools/smoke.ps1 -Executable ./build/Debug/MeridianCoast.exe -Frames 120 -Scene lifecycle -MsaaLimit 1 -RequireTiming

      - name: Validate two-sample HDR resolve and resize
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./tools/smoke.ps1 -Executable ./build/Debug/MeridianCoast.exe -Frames 120 -Scene lifecycle -MsaaLimit 2 -RequireTiming

      - name: Validate CPU timing with GPU timestamps disabled
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./tools/smoke.ps1 -Executable ./build/Debug/MeridianCoast.exe -Frames 120 -Scene lifecycle -DisableGpuTimestamps -RequireTiming

      - name: Capture geography, weather, and vehicle scenes
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./tools/visual-sweep.ps1 -Executable ./build/Release/MeridianCoast.exe -Frames 8

      # GitHub's first-party artifact transport is CI infrastructure only. It is
      # never linked, bundled, installed, or required by the game or local build.
      - name: Upload executable and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MeridianCoast-Windows-x64-${{ matrix.configuration }}
          if-no-files-found: warn
          path: |
            build/${{ matrix.configuration }}/MeridianCoast.exe
            build/${{ matrix.configuration }}/MeridianCoast.exe.sha256
            build/${{ matrix.configuration }}/MeridianCoast.exe.imports.txt
            build/${{ matrix.configuration }}/smoke*.bmp
            build/${{ matrix.configuration }}/smoke*-report.json
            build/${{ matrix.configuration }}/smoke-*.log
            build/${{ matrix.configuration }}/visual-sweep.json
